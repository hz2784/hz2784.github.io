<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides — Dyslexia Reading Aid Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #F7F3EB;
  --cream-2: #EDE8DC;
  --forest: #1C3422;
  --forest-mid: #2C4E35;
  --amber: #B8782A;
  --amber-light: #E8C485;
  --terracotta: #8B4E38;
  --ink: #1E1A14;
  --ink-mid: #3D3830;
  --ink-light: #6B6358;
  --ink-pale: #9C9488;
  --white: #FDFAF5;
  --rule: rgba(30,26,20,0.12);
}

body {
  font-family: 'Lora', Georgia, serif;
  background: var(--cream);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 1.25rem 3rem;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(247,243,235,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--rule);
}
.nav-logo {
  font-family: 'Jost', sans-serif;
  font-weight: 400; font-size: 13px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-mid);
  text-decoration: none;
}
.nav-links { display: flex; gap: 2rem; }
.nav-links a {
  font-family: 'Jost', sans-serif; font-size: 12px;
  font-weight: 400; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-light);
  text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--forest); }

/* ── PASSWORD GATE ── */
.password-gate {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 2rem;
}
.password-gate h1 {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 1.8rem; color: var(--forest);
  margin-bottom: 0.5rem;
}
.password-gate p {
  font-size: 0.95rem; color: var(--ink-light);
  margin-bottom: 2rem;
}
.password-form {
  display: flex; gap: 10px; align-items: center;
}
.password-input {
  font-family: 'Jost', sans-serif; font-size: 14px;
  padding: 12px 16px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--white);
  color: var(--ink);
  outline: none;
  width: 200px;
  letter-spacing: 0.15em;
  transition: border-color 0.2s;
}
.password-input:focus { border-color: var(--forest); }
.password-btn {
  font-family: 'Jost', sans-serif; font-size: 12px;
  font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--white); background: var(--forest);
  border: none; padding: 13px 24px; cursor: pointer;
  border-radius: 4px; transition: background 0.2s;
}
.password-btn:hover { background: var(--forest-mid); }
.password-error {
  font-family: 'Jost', sans-serif; font-size: 12px;
  color: var(--terracotta); margin-top: 1rem;
  opacity: 0; transition: opacity 0.2s;
}
.password-error.show { opacity: 1; }

/* ── PDF VIEWER ── */
.pdf-viewer {
  display: none;
  padding: 6rem 3rem 3rem;
}
.pdf-viewer.visible { display: block; }
.pdf-viewer iframe {
  width: 100%;
  height: calc(100vh - 8rem);
  border: 1px solid var(--rule);
  border-radius: 4px;
}
.pdf-back {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Jost', sans-serif; font-size: 12px;
  font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--forest); text-decoration: none;
  border-bottom: 1px solid var(--forest);
  padding-bottom: 3px;
  margin-top: 1.5rem;
  transition: gap 0.2s;
}
.pdf-back:hover { gap: 14px; }

@media (max-width: 900px) {
  nav { padding: 1.1rem 1.5rem; }
  .nav-links { gap: 1.25rem; }
  .pdf-viewer { padding: 5rem 1.5rem 2rem; }
}
@media (max-width: 600px) {
  nav { padding: 1rem 1.25rem; }
  .nav-links { gap: 1rem; }
  .nav-links a { font-size: 11px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Reading&nbsp;as&nbsp;Practice</a>
  <div class="nav-links">
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="research.html">Research</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<!-- PASSWORD GATE -->
<div class="password-gate" id="gate">
  <h1>Presentation Slides</h1>
  <p>Please enter the password to view.</p>
  <div class="password-form">
    <input type="password" class="password-input" id="pw" placeholder="Password" autofocus>
    <button class="password-btn" id="submit">Enter</button>
  </div>
  <p class="password-error" id="error">Incorrect password. Please try again.</p>
</div>

<!-- PDF VIEWER -->
<div class="pdf-viewer" id="viewer">
  <iframe id="pdf-frame" src="" loading="lazy"></iframe>
  <a href="project-dyslexia.html" class="pdf-back">← Back to project</a>
</div>

<script>
const HASH = 'aa9d432573c934c5be360b898d76b0414638986dd1e3e9df44e3f1cc07be9b57';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function check() {
  const pw = document.getElementById('pw').value;
  const hash = await sha256(pw);
  if (hash === HASH) {
    document.getElementById('gate').style.display = 'none';
    const viewer = document.getElementById('viewer');
    viewer.classList.add('visible');
    document.getElementById('pdf-frame').src = 'immersive-reading-slides.pdf';
  } else {
    document.getElementById('error').classList.add('show');
  }
}

document.getElementById('submit').addEventListener('click', check);
document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') check();
});
</script>

</body>
</html>
